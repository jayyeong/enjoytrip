<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>EnjoyTrip · 나를 위한 여행의 시작</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/features.css"></head>
<body><header><a class="brand" href="#explore">enjoytrip.</a><nav aria-label="메인 메뉴"><a href="#explore">여행지</a><a href="#favorites">찜</a><a href="#plan">나의 여행</a><a href="#hotplace">핫플레이스</a><a href="#board">여행 이야기</a><a href="#notice">공지</a></nav><div id="account"></div></header>
<main>
<div class="section-heading"><span id="section-tag" class="eyebrow">EXPLORE KOREA</span><h2 id="section-title">어디로 떠나볼까요?</h2><p id="section-desc">지역과 취향으로 찾아보는 나의 다음 여행지</p></div>
<section id="explore" class="view map-workspace"><div id="category-menu" class="category-menu" aria-label="여행 유형"></div><div class="map-body"><aside class="map-sidebar" aria-label="여행지 검색과 결과"><div class="sidebar-heading"><h2>전체 관광정보 검색</h2><button type="button" id="filter-toggle" aria-expanded="false" aria-controls="search">검색 조건</button></div><form id="search" class="search-bar"><label>지역<select id="region" class="form-select"></select></label><label>시·군·구<select id="district" class="form-select"><option value="">지역을 먼저 선택하세요</option></select></label><label class="keyword-field">전국 장소 이름 검색<input id="keyword" class="form-control" placeholder="예: 경복궁, 해운대 (지도 밖도 검색)"></label><button class="btn btn-primary">검색하기</button><button type="button" class="btn btn-outline-secondary" id="nearby">내 주변</button></form><div class="search-context" id="search-context" hidden><span id="search-summary"></span><button type="button" id="search-reset">조건 초기화</button></div><div class="result-line"><strong id="result-count"></strong><span id="data-status" role="status"></span></div><div class="results-scroll"><h3 id="list-heading" class="list-heading">전체 검색 결과</h3><div id="spots" class="spot-list" aria-live="polite"></div><button id="more" class="btn btn-outline-secondary" hidden>더 보기</button></div></aside><div class="map-wrap"><div id="map" role="region" aria-label="여행 지도"></div><p id="map-status" class="small"></p></div></div><select id="category" hidden aria-label="여행 유형"></select></section>
<section id="plan" class="view" hidden><div class="panel"><div class="plan-heading"><p id="plan-mode">새 여행계획</p><button type="button" id="plan-new" hidden>새 계획 만들기</button></div><p>장소를 추가하고 방문 순서를 정한 뒤 저장하세요. 드래그 또는 화살표로 순서를 바꿀 수 있습니다.</p><form id="plan-form"><div class="form-grid"><label>여행 이름<input class="form-control" name="title" required maxlength="80" placeholder="나의 설레는 여행"></label><label>출발일<input class="form-control" name="date" type="date" required></label><label>여행경비 (원)<input class="form-control" name="budget" type="number" min="0" value="0" required></label></div><label>상세 계획<textarea class="form-control" name="memo" maxlength="2000" placeholder="일정별 시간, 이동 방법과 준비물을 적어보세요"></textarea></label><ol id="route-list"></ol><button class="btn btn-primary" id="plan-save">여행계획 저장</button><p class="storage-note">계획은 이 브라우저에 저장됩니다.</p></form></div><h3 class="mt-4">저장한 여행</h3><div id="saved-plans" class="tile-grid"></div></section>
<section id="favorites" class="view" hidden><p class="view-intro">마음에 드는 장소를 가볍게 모아두세요. 찜은 이 브라우저에 저장됩니다.</p><div id="favorite-list" class="tile-grid"></div></section>
<section id="hotplace" class="view" hidden><button class="btn btn-primary mb-4" id="hot-add">장소 소개하기 +</button><div id="hot-list" class="tile-grid"></div></section>
<section id="board" class="view" hidden><div class="board-toolbar"><input id="board-search" class="form-control" placeholder="제목 또는 내용 검색" aria-label="게시글 검색"><button class="btn btn-primary" id="post-add">글쓰기</button></div><div id="post-list"></div><div id="board-content" class="board-content" hidden></div></section>
<section id="notice" class="view" hidden><button class="btn btn-primary mb-3" id="notice-add">공지 등록</button><div id="notice-list"></div><div id="notice-content" class="board-content" hidden></div></section>
<section id="profile" class="view" hidden><div id="profile-content" class="panel narrow"></div></section>
</main><a href="#plan" id="journey-link" class="journey-link" hidden></a><footer><a class="brand" href="#explore">enjoytrip.</a><small>© EnjoyTrip · 관광정보 제공 한국관광공사</small></footer><dialog id="modal"><button id="modal-close" type="button" class="close-button" aria-label="닫기">×</button><div id="modal-content"></div></dialog><div id="toast" role="status" aria-live="polite"></div><script type="module" src="js/main.js"></script></body></html>
