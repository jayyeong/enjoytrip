name: Frontend CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check and build public site
        run: npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm test
      - name: Verify Java API
        run: |
          java -cp backend/build enjoytrip.Server dist 8001 > /tmp/enjoytrip-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8001/ > /dev/null; then break; fi
            sleep 1
          done
          npm run test:api
      - name: Verify deployment entrypoints
        run: |
          test -f dist/index.html
          test -f dist/01_api/js/keys.js
          test ! -f dist/README.md
          test ! -d dist/.git
      - uses: actions/upload-artifact@v4
        with:
          name: enjoytrip-site
          path: dist/
          retention-days: 7

