name: Frontend CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check and build public site
        run: npm run build
      - name: Verify deployment entrypoints
        run: |
          test -f dist/index.html
          test -f dist/01_api/js/keys.js
          test ! -f dist/README.md
          test ! -d dist/.git
      - uses: actions/upload-artifact@v4
        with:
          name: enjoytrip-site
          path: dist/
          retention-days: 7
